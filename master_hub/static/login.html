<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical RMM — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #090a0f;
            --bg-panel: #111319;
            --bg-input: #181b24;
            --border: #232734;
            --border-focus: #3b82f6;
            --text-main: #f3f4f6;
            --text-sub: #828a9e;
            --text-muted: #52596d;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Sharp minimalist zero-radius aesthetic */
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .login-box {
            width: 100%;
            max-width: 360px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 32px 28px;
        }

        .brand-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--text-main);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2563eb;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            letter-spacing: 0.02em;
        }

        .forgot-link {
            font-size: 11px;
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.15s;
        }

        .forgot-link:hover {
            color: #93c5fd;
        }

        .input-wrap {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 38px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 0 12px;
            color: var(--text-main);
            font-size: 13px;
            font-family: var(--font-sans);
            transition: border-color 0.15s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .toggle-pwd {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-pwd:hover {
            color: var(--text-sub);
        }

        .btn-submit {
            width: 100%;
            height: 38px;
            background: var(--primary);
            border: 1px solid var(--primary-hover);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: background-color 0.15s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-alert {
            padding: 8px 12px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.4;
            border-left: 3px solid transparent;
        }

        .status-alert.error {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: #ef4444;
            color: #fca5a5;
        }

        .status-alert.success {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: #10b981;
            color: #6ee7b7;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        .modal-title {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-body {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-cancel {
            height: 34px;
            padding: 0 14px;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
            font-size: 12px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            color: var(--text-main);
            border-color: var(--text-sub);
        }

        .btn-modal-submit {
            height: 34px;
            padding: 0 14px;
            background: var(--primary);
            color: #ffffff;
            border: 1px solid var(--primary-hover);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="brand-header">
            <h1 class="brand-title">Tactical RMM</h1>
        </div>

        <div id="statusAlert" class="status-alert"></div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)">
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="usernameInput">Username</label>
                </div>
                <div class="input-wrap">
                    <input type="text" id="usernameInput" class="form-input" placeholder="admin" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="passwordInput" id="passwordLabel">Password</label>
                    <a href="javascript:void(0)" class="forgot-link" id="forgotLink" onclick="openMasterKeyModal()">Forgot password?</a>
                </div>
                <div class="input-wrap">
                    <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('passwordInput', this)" title="Toggle password">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group" id="confirmGroup" style="display: none;">
                <div class="form-label-row">
                    <label class="form-label" for="confirmPasswordInput">Confirm Password</label>
                </div>
                <div class="input-wrap">
                    <input type="password" id="confirmPasswordInput" class="form-input" placeholder="••••••••" autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span id="btnText">Sign In</span>
            </button>
        </form>
    </div>

    <!-- Password Reset / Access Key Modal -->
    <div id="masterKeyModal" class="modal-overlay">
        <div class="modal-card">
            <h3 class="modal-title">Master Access Key</h3>
            <div class="modal-body">
                <p style="margin-bottom: 10px;">Enter your system Master Access Key to authorize session:</p>
                <div class="input-wrap">
                    <input type="password" id="modalMasterKeyInput" class="form-input" placeholder="Access Key">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeMasterKeyModal()">Cancel</button>
                <button type="button" class="btn-modal-submit" onclick="submitMasterKey()">Authorize</button>
            </div>
        </div>
    </div>

    <script>
        let isSetupMode = false;

        async function checkSetupState() {
            try {
                const res = await fetch("/api/auth/status");
                const data = await res.json();
                setSetupMode(!!data.setup_required);
            } catch (e) {
                console.error("Auth status check error:", e);
            }
        }

        function setSetupMode(setup) {
            isSetupMode = setup;
            const confirmGroup = document.getElementById("confirmGroup");
            const confirmInput = document.getElementById("confirmPasswordInput");
            const btnText = document.getElementById("btnText");
            const forgotLink = document.getElementById("forgotLink");
            const passwordLabel = document.getElementById("passwordLabel");

            if (setup) {
                passwordLabel.innerText = "Create Password";
                confirmGroup.style.display = "block";
                confirmInput.required = true;
                btnText.innerText = "Create Account & Sign In";
                forgotLink.style.display = "none";
            } else {
                passwordLabel.innerText = "Password";
                confirmGroup.style.display = "none";
                confirmInput.required = false;
                btnText.innerText = "Sign In";
                forgotLink.style.display = "inline";
            }
        }

        function showAlert(msg, type = "error") {
            const el = document.getElementById("statusAlert");
            el.className = `status-alert ${type}`;
            el.innerText = msg;
            el.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("statusAlert").style.display = "none";
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                input.type = "password";
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById("usernameInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            const btn = document.getElementById("btnSubmit");

            if (isSetupMode) {
                const confirmPass = document.getElementById("confirmPasswordInput").value;
                if (password !== confirmPass) {
                    showAlert("Passwords do not match.");
                    return;
                }
                if (password.length < 6) {
                    showAlert("Password must be at least 6 characters.");
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = `<span>Creating Account...</span>`;

                try {
                    const res = await fetch("/api/auth/setup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showAlert("Account created. Redirecting...", "success");
                        setTimeout(() => { window.location.href = "/"; }, 500);
                    } else {
                        showAlert(data.error || "Setup failed.");
                        btn.disabled = false;
                        btn.innerHTML = `<span>Create Account & Sign In</span>`;
                    }
                } catch (err) {
                    showAlert("Network error during setup.");
                    btn.disabled = false;
                    btn.innerHTML = `<span>Create Account & Sign In</span>`;
                }
            } else {
                btn.disabled = true;
                btn.innerHTML = `<span>Signing in...</span>`;

                try {
                    const res = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showAlert("Authenticated. Redirecting...", "success");
                        setTimeout(() => { window.location.href = "/"; }, 400);
                    } else {
                        showAlert(data.error || "Invalid username or password.");
                        btn.disabled = false;
                        btn.innerHTML = `<span>Sign In</span>`;
                    }
                } catch (err) {
                    showAlert("Authentication request failed.");
                    btn.disabled = false;
                    btn.innerHTML = `<span>Sign In</span>`;
                }
            }
        }

        function openMasterKeyModal() {
            document.getElementById("masterKeyModal").style.display = "flex";
            document.getElementById("modalMasterKeyInput").value = "";
            document.getElementById("modalMasterKeyInput").focus();
        }

        function closeMasterKeyModal() {
            document.getElementById("masterKeyModal").style.display = "none";
        }

        async function submitMasterKey() {
            const key = document.getElementById("modalMasterKeyInput").value.trim();
            if (!key) {
                alert("Please enter Master Access Key.");
                return;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: "Admin", password: key })
                });
                const data = await res.json();
                if (data.success) {
                    closeMasterKeyModal();
                    showAlert("Access Key accepted. Redirecting...", "success");
                    setTimeout(() => { window.location.href = "/"; }, 400);
                } else {
                    alert("Invalid Master Access Key.");
                }
            } catch (err) {
                alert("Authorization error: " + err.message);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkSetupState();
        });
    </script>
</body>
</html>
