# Nginx configuration for rmm.swiftvtu.com
# Place in /etc/nginx/sites-available/rmm.swiftvtu.com and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name rmm.swiftvtu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rmm.swiftvtu.com;

    # SSL certificates generated via: sudo certbot --nginx -d rmm.swiftvtu.com
    ssl_certificate /etc/letsencrypt/live/rmm.swiftvtu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmm.swiftvtu.com/privkey.pem;

    client_max_body_size 250M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Persistent WebSocket reverse proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts to prevent WebSocket disconnects on idle agents
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
